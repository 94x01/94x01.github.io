<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveryWhen</title>
    <style>
        body {
            background-color: #000;
            color: #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            
            justify-content: flex-start; 
            min-height: 100vh;          
            padding: 80px 40px;          
            box-sizing: border-box;
            
            margin: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            letter-spacing: 1.5px;
        }

        .story {
            text-align: center;
            font-size: max(1rem, 1.1vw); 
            line-height: 2.2;
            margin-bottom: 8%;        
            width: 100%;
            max-width: 600px;           
        }

        .hidden-hint {
            color: #000;
            transition: color 0.5s ease;
        }
        .hidden-hint:hover, .hidden-hint:active {
            color: #880000; 
            cursor: pointer;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #444;
            color: white;
            text-align: center;
            
            font-size: max(1rem, 1.2vw); 
            padding: 10px;
            width: 80%;                 
            max-width: 300px;           
            
            outline: none;
            transition: border-bottom 0.3s ease;
            margin-top: 30px;
            margin-bottom: 80px;       
        }
        input:focus {
            border-bottom: 1px solid #fff;
        }
    </style>
</head>
<body>

    <iframe width="0" height="0" src="https://www.youtube.com/embed/PkedbUCv8d8?autoplay=1&loop=1&playlist=PkedbUCv8d8" frameborder="0" allow="autoplay"></iframe>

    <div class="story">
        <p>"뭐야......."</p>
        <br>
        <p>모니터는 지직거리는 소리만을 뱉어내다 이내 꺼지고 말았습니다.</p>
        <p>괜히 불쾌해진 세훈은 뒷통수를 긁으며 의자에서 일어났습니다.</p>
        <p>주위를 둘러보던 세훈은 거울 하나를 발견했습니다.</p>
        <br>
        <p>거울을 자세히 들여다보니 창백한 얼굴이 보입니다.</p>
        <p>세훈은 무언가 잊고 있던 것을 떠올리고 있었습니다.</p>
        <br>
        <p class="hidden-hint">내가 누구를 찾으러 왔더라.</p>
    </div>

    <input type="text" id="answerInput" placeholder="..." onkeypress="if(event.keyCode==13) checkAnswer()" autocomplete="off">

    <script>
        function checkAnswer() {
            var answer = document.getElementById("answerInput").value.trim().toLowerCase();
            
            if(answer === "junmyeon") {
                window.location.href = "/" + answer + "/";
            } else if (answer !== "") {
                alert("내가 잊고 있는 건 그게 아닌데.");
                document.getElementById("answerInput").value = "";
            }
        }
    </script>

</body>
</html>
