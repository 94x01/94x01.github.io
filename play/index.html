<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두 번째 방</title>
    <style>
        body {
            background-color: #000; /* 조금 더 어두운 블랙 */
            color: #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            letter-spacing: 1.5px; /* 글자 간격 넓히기 */
        }
        .story {
            text-align: center;
            font-size: 1.2rem;
            line-height: 2.2;
            margin-bottom: 40px;
        }
        
        /* 마우스를 올리면 글씨 색이 변하는 효과 */
        .hidden-hint {
            color: #000; /* 배경과 같은 색으로 숨김 */
            transition: color 0.5s ease;
        }
        .hidden-hint:hover {
            color: #880000; /* 마우스를 올리면 붉은색으로 나타남 */
            cursor: pointer;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #444;
            color: white;
            text-align: center;
            font-size: 1.2rem;
            padding: 8px 10px;
            width: 250px;
            outline: none;
            transition: border-bottom 0.3s ease;
            margin-top: 30px;
        }
        input:focus {
            border-bottom: 1px solid #fff;
        }
    </style>
</head>
<body>

    <!-- 1. 으스스한 배경음악 (유튜브 영상 숨기기 방식) -->
    <!-- src 부분의 영어 주소를 다른 유튜브 영상 ID로 바꾸면 음악 변경 가능 -->
    <!-- autoplay=1(자동재생), loop=1(반복재생) 설정 -->
    <iframe width="0" height="0" src="https://www.youtube.com/embed/PjRkU4pAtr8?autoplay=1&loop=1&playlist=PjRkU4pAtr8" frameborder="0" allow="autoplay"></iframe>

    <div class="story">
        <p>문을 열고 들어오니 거울이 하나 있다.</p>
        <p>거울 속의 당신은 입술을 달싹이며 무언가 말하고 있다.</p>
        <br>
        <p>거울을 자세히 들여다보니 희미한 글씨가 보인다.</p>
        <!-- 마우스를 올려야 보이는 숨겨진 힌트 -->
        <p class="hidden-hint">"나의 이름은 반대로 읽어도 같다."</p>
    </div>

    <!-- 정답 입력칸 -->
    <input type="text" id="answerInput" placeholder="..." onkeypress="if(event.keyCode==13) checkAnswer()" autocomplete="off">

    <script>
        function checkAnswer() {
            var answer = document.getElementById("answerInput").value.trim().toLowerCase();
            
            // 2단계 정답을 'level' 이라고 설정했습니다. 
            // 정답을 맞히면 세 번째 방(level 폴더)으로 이동합니다.
            if(answer === "level") {
                window.location.href = "/" + answer + "/";
            } else if (answer !== "") {
                // 오답일 경우 흔들리는 효과나 메시지를 줄 수 있습니다.
                alert("틀렸습니다.");
                document.getElementById("answerInput").value = ""; // 입력창 비우기
            }
        }
    </script>

</body>
</html>
