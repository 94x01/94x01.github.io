<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveryWhen</title>
    <style>
        body {
            background-color: #000; /* 조금 더 어두운 블랙 */
            color: #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            letter-spacing: 1.5px; /* 글자 간격 넓히기 */
        }
        .story {
            text-align: center;
            font-size: 1.2rem;
            line-height: 2.2;
            margin-bottom: 40px;
        }
        .hidden-hint:hover {
            color: #880000; /* 마우스를 올리면 붉은색으로 나타남 */
            cursor: pointer;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #444;
            color: white;
            text-align: center;
            font-size: 1.2rem;
            padding: 8px 10px;
            width: 250px;
            outline: none;
            transition: border-bottom 0.3s ease;
            margin-top: 30px;
        }
        input:focus {
            border-bottom: 1px solid #fff;
        }
    </style>
</head>
<body>

    <!-- 1. 으스스한 배경음악 (유튜브 영상 숨기기 방식) -->
    <!-- src 부분의 영어 주소를 다른 유튜브 영상 ID로 바꾸면 음악 변경 가능 -->
    <!-- autoplay=1(자동재생), loop=1(반복재생) 설정 -->
    <iframe width="0" height="0" src="https://youtu.be/PkedbUCv8d8?si=XQgxusb5qQ3jjHNw" frameborder="0" allow="autoplay"></iframe>

    <div class="story">
        <p>"뭐야......."</p>
        <br>
        <p>모니터는 지직거리는 소리만을 뱉어내다 이내 꺼지고 말았습니다.</p>
        <p>괜히 불쾌해진 세훈은 뒷통수를 긁으며 의자에서 일어났습니다.</p>
        <p>주위를 둘러보던 세훈은 거울 하나를 발견했습니다.</p>
        <br>
        <p>거울을 자세히 들여다보니 창백한 얼굴이 보입니다.</p>
        <p>세훈은 무언가 잊고 있던 것을 떠올리고 있었습니다.</p>
        <br>
        <!-- 마우스를 올려야 보이는 숨겨진 힌트 -->
        <p class="hidden-hint">내가 누구를 찾으러 왔더라.</p>
    </div>

    <!-- 정답 입력칸 -->
    <input type="text" id="answerInput" placeholder="..." onkeypress="if(event.keyCode==13) checkAnswer()" autocomplete="off">

    <script>
        function checkAnswer() {
            var answer = document.getElementById("answerInput").value.trim().toLowerCase();
            
            // 2단계 정답을 'level' 이라고 설정했습니다. 
            // 정답을 맞히면 세 번째 방(level 폴더)으로 이동합니다.
            if(answer === "level") {
                window.location.href = "/" + answer + "/";
            } else if (answer !== "") {
                // 오답일 경우 흔들리는 효과나 메시지를 줄 수 있습니다.
                alert("틀렸습니다.");
                document.getElementById("answerInput").value = ""; // 입력창 비우기
            }
        }
    </script>

</body>
</html>
