<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveryWhen</title>
    <style>
        body {
            background-color: #050505; 
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; 
            margin: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            letter-spacing: 1px;
        }
        .story {
            text-align: center;
            font-size: 1.1rem;
            line-height: 2;
            margin-bottom: 40px;
        }
        .hint {
            font-size: 0.85rem;
            color: #666;
            margin-top: 20px;
        }
        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #555; 
            color: white;
            text-align: center;
            font-size: 1.2rem;
            padding: 5px 10px;
            width: 250px;
            outline: none;
            transition: border-bottom 0.3s ease;
        }
        input:focus {
            border-bottom: 1px solid #fff;
        }
    </style>
</head>
<body>

    <div class="story">
        <p>당신은 어두운 방에서 눈을 떴습니다.</p>
        <p>책상 위에는 쪽지가 하나 놓여 있습니다.</p>
        <br>
        <p>"A는 첫 번째. P는 16번째. 그렇다면 사과는 무엇인가?"</p>
    </div>

    <!-- 정답 입력칸 -->
    <input type="text" id="answerInput" placeholder="..." onkeypress="if(event.keyCode==13) checkAnswer()" autocomplete="off">

    <script>
        function checkAnswer() {
            var answer = document.getElementById("answerInput").value.trim().toLowerCase();
            if(answer !== "") {
                window.location.href = "/" + answer + "/";
            }
        }
    </script>

</body>
</html>
