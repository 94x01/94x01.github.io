<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EveryWhen</title>
    <style>
        body {
            background-color: #050505; 
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; 
            margin: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            letter-spacing: 1px;
            padding: 20px;
            box-sizing: border-box;
        }
        .story {
            text-align: center;
            font-size: max(1rem, 1.1vw);
            line-height: 2;
            margin-bottom: 8%;
            width: 100%;
            max-width: 600px;
        }
        .hint {
            font-size: 0.85rem;
            color: #666;
            margin-top: 20px;
        }
        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #555; 
            color: white;
            text-align: center;
            font-size:  max(1rem, 1.2vw);
            padding: 10px;
            width: 80%;
            max-width: 300px;
            outline: none;
            transition: border-bottom 0.3s ease;
        }
        input:focus {
            border-bottom: 1px solid #fff;
        }
    </style>
</head>
<body>

    <div class="story">
        <p>세훈은 어두운 방에서 눈을 떴습니다.</p>
        <p>책상 위에는 까만 모니터와 리모컨 하나가 놓여 있습니다.</p>
        <br>
        <p>"이게 뭐야......."</p>
        <br>
        <p>세훈은 손을 뻗어 리모컨을 쥐었습니다.</p>
        <p>책상 위에는 까만 모니터와 리모컨 하나가 놓여 있습니다.</p>
        <p>그 순간 화면이 켜졌습니다.</p>
        <p>책상 위에는 까만 모니터와 리모컨 하나가 놓여 있습니다.</p>
        <br>
        <p>리모컨에는 버튼이 세 개.</p>
        <p>재생 버튼과 정지 버튼.</p>
        <br>
        <p>"뭐라도 눌러봐야 하나?"</p>
    </div>

    <!-- 정답 입력칸 -->
    <input type="text" id="answerInput" placeholder="..." onkeypress="if(event.keyCode==13) checkAnswer()" autocomplete="off">

    <script>
        function checkAnswer() {
            var answer = document.getElementById("answerInput").value.trim().toLowerCase();
            if(answer !== "") {
                window.location.href = "/" + answer + "/";
            }
        }
    </script>

</body>
</html>
