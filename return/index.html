<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-1</title>
    <style>
        body {
            background-color: #050505; 
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            letter-spacing: 1px;
            min-height: 100vh;
            line-height: 1.9;
            justify-content: flex-start;
            padding: 80px 40px;
            box-sizing: border-box;
        }
      .button {
        width: 100%;
        display: flex;
        justify-content: center;
        margin-top: 40px;
        margin-bottom: 80px;
      }
      .back-btn {
        background: transparent;
        border: 1px solid #555;  
        color: #e0e0e0;             
        padding: 10px 24px;
        font-size: 0.95rem;
        cursor: pointer;
        letter-spacing: 1px;
        transition: all 0.3s ease;
      }
      .back-btn:hover, .back-btn:active {
        background: #ffffff;       
        color: #000000;             
        border-color: #ffffff;
      }
        .story {
            text-align: left;
            font-size: max(1rem, 1.1vw);
            line-height: 3;
            margin-bottom: 8%;
            width: 100%;
            max-width: 600px;
            word-break: keep-all;
        }
        .title {
            text-align: center;
            font-weight: bold;
            font-size: 1.3rem;
            margin: 50px 0;
            color: #ffffff;
        }
        .hint {
            font-size: 0.85rem;
            color: #666;
            margin-top: 20px;
        }
      
        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #555; 
            color: white;
            text-align: center;
            font-size:  max(1rem, 1.2vw);
            padding: 10px;
            width: 100%;
            max-width: 600px;
            outline: none;
            transition: border-bottom 0.3s ease;
            margin-bottom: 15%;
        }
        input:focus {
            border-bottom: 1px solid #fff;
        }
    </style>
</head>
<body>

    <div class="story">
        <p>세훈이 버튼을 누르자마자 잠이 몰려옵니다.</p>
      <p>몰려오는 졸음에 몸을 맡길 수밖에 없습니다. 눈을 스르륵 감습니다.</p>
        <br>
      <p>깜빡.</p>
        <p>몇 시간이 지났을까요, 아니면 몇일? 세훈은 익숙한 방에서 눈을 뜹니다. 7시 정각임을 알리고 있는 알람이 울립니다. 몸을 일으키자 옷걸이에 걸려 가지런히 정리되어 있는 교복이 세훈의 눈에 들어옵니다.</p>
        <p>기억을 더듬어보니 오늘은 개학식인 것 같습니다. 아마 세훈은 무언가를 잊고 있는 듯했으나, 어떠한 흔적도 없는 누군가를 떠올릴 수는 없습니다.</p>
        <p>그렇게 세훈은 살아가야 합니다.</p>
        <br>
      <div class="title"># 엔딩 1. 망각</div>
    </div>



</body>
<div class="button">
    <button class="back-btn" onclick="goMain()">돌아가기</button>
</div>

<script>
    function goMain() {
        window.location.href = "/main/";
    }
</script>
</html>
